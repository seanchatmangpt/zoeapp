
[project]
name = "post-cyberpunk-foundry"
version = "30.1.2"
description = "Final actuation of the Post-Cyberpunk process intelligence substrate."

[ontology]
source = "/Users/sac/process-intelligence/research/pi-program/ggen/ontology/pi-program.ttl"

[[inference.rules]]
name = "normalize"
construct = "CONSTRUCT { ?s ?p ?o } WHERE { ?s ?p ?o . FILTER(false) }"
order = 1

[generation]
enabled = true
rules = [
    { name = "pcp-types", query = { inline = "SELECT * WHERE { VALUES (?variant ?field ?fieldType) { (\"PartialReplay\" \"cost\" \"number\") (\"Evaluated\" \"values\" \"record\") } }" }, template = { inline = "export type {{ variant }} = { type: '{{ variant }}', {{ field }}: {{ fieldType }} };\n" }, output_file = "/Users/sac/pcp/packages/core/types_generated.ts" },
    { name = "wasm4pm-boundary", query = { inline = "SELECT * WHERE { VALUES (?gateCount ?instructionCeiling) { (150 1000000) } }" }, template = { inline = "pub const GATES: u64 = {{ gateCount }};\npub const CEILING: u64 = {{ instructionCeiling }};\n" }, output_file = "/Users/sac/wasm4pm/src/boundary_generated.rs" },
    { name = "zoe-board-claims", query = { inline = "SELECT * WHERE { VALUES (?claim ?status) { (\"Synergy\" \"VALIDATED\") (\"Debt\" \"MINOR\") } }" }, template = { inline = "export const {{ claim }}Status = '{{ status }}';\n" }, output_file = "/Users/sac/zoeapp/src/framework/v30/post-cyberpunk/BoardClaims_generated.ts" }
]
